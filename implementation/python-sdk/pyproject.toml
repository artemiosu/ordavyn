[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbridge"
version = "0.1.0"
description = "AgentBridge — protocol for safe, efficient, standardized interaction in the future internet"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "AgentBridge Project", email = "noreply@agentbridge.dev"}
]
keywords = ["protocol", "agent", "ai", "interaction", "rpc", "api", "federation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "cryptography>=42.0",
]

[project.urls]
Homepage = "https://github.com/artemiosu/agentbridge-protocol"
Repository = "https://github.com/artemiosu/agentbridge-protocol"
Documentation = "https://github.com/artemiosu/agentbridge-protocol#readme"
Issues = "https://github.com/artemiosu/agentbridge-protocol/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentbridge*"]
