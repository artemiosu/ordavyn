{
  "name": "CI",
  "on": {"pull_request": null, "push": {"branches": ["main"]}},
  "permissions": {"contents": "read"},
  "jobs": {
    "verify": {
      "runs-on": "ubuntu-24.04",
      "permissions": {"contents": "read"},
      "steps": [
        {"uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", "with": {"persist-credentials": false, "fetch-depth": 0}},
        {"uses": "actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c", "with": {"python-version": "3.13.15"}},
        {"name": "Smoke test ordinary source install", "run": "smoke_venv=\"$(mktemp -d \"${RUNNER_TEMP}/ordavyn-smoke.XXXXXX\")\"\npython -m venv \"$smoke_venv\"\n\"$smoke_venv/bin/python\" -m pip install ./implementation/python-sdk\n\"$smoke_venv/bin/python\" implementation/demo/demo_multi.py"},
        {"name": "Install locked verification dependencies", "run": "python -m pip install --require-hashes -r release/verification-requirements.txt"},
        {"name": "Install checkout SDK without dependency resolution", "run": "python -m pip install --no-deps --no-build-isolation ./implementation/python-sdk"},
        {"name": "Install pinned rustfmt", "run": "rustup component add rustfmt --toolchain 1.98.1"},
        {"name": "Fetch locked Rust dependencies", "run": "cargo +1.98.1 fetch --manifest-path implementation/Cargo.toml --locked --target x86_64-unknown-linux-gnu"},
        {"name": "Build locked Rust examples", "run": "cargo +1.98.1 build --manifest-path implementation/Cargo.toml --examples --locked --offline"},
        {"name": "Repository checks", "run": "python -m unittest discover -s tools/tests -v"},
        {"name": "Guide and GitHub package checks", "run": "python tools/verify_guides.py --root ."},
        {"name": "Python and interoperability tests", "run": "python -m pytest -q implementation/python-sdk/tests implementation/tests"},
        {"name": "Rust format", "run": "cargo +1.98.1 fmt --manifest-path implementation/Cargo.toml --all --check"},
        {"name": "Rust tests", "run": "cargo +1.98.1 test --manifest-path implementation/Cargo.toml --locked --offline"},
        {"name": "Real checkout export composition", "run": "python tools/export_release.py --check"},
        {"name": "Prospective DCO range", "run": "python tools/verify_dco.py --head \"${{ github.event.pull_request.head.sha || github.sha }}\""}
      ]
    }
  }
}
