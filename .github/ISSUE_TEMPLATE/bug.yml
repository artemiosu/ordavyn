{
  "name": "Defect report",
  "description": "Report reproducible behavior in the protocol or SDKs",
  "title": "[Defect] ",
  "labels": ["bug"],
  "body": [
    {"type": "markdown", "attributes": {"value": "Do not report suspected vulnerabilities here. Read SECURITY.md first."}},
    {"type": "textarea", "id": "behavior", "attributes": {"label": "Observed behavior", "description": "What happened, and what did you expect instead?"}, "validations": {"required": true}},
    {"type": "textarea", "id": "reproduce", "attributes": {"label": "Reproduction", "description": "Provide the smallest safe sequence that reproduces the problem."}, "validations": {"required": true}},
    {"type": "input", "id": "version", "attributes": {"label": "Version or commit"}, "validations": {"required": true}},
    {"type": "dropdown", "id": "scope", "attributes": {"label": "Affected area", "options": ["Rust SDK", "Python SDK", "Wire profile", "Documentation", "Packaging or verification"]}, "validations": {"required": true}},
    {"type": "textarea", "id": "tests", "attributes": {"label": "Tests or evidence", "description": "List commands, logs, or a proposed regression test. Remove secrets and personal data."}}
  ]
}
